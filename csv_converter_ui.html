<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV → Parquet Converter</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #18181f;
      --surface2: #22222d;
      --border: #2e2e3e;
      --accent: #a78bfa;
      --accent2: #34d399;
      --accent3: #f472b6;
      --text: #e2e0f0;
      --muted: #7a7a9a;
      --error: #f87171;
      --warn: #fbbf24;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* ---------- HEADER ---------- */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
    }
    header p {
      color: var(--muted);
      margin-top: 0.6rem;
      font-size: 0.95rem;
    }

    /* ---------- LAYOUT ---------- */
    .container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ---------- PANEL ---------- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ---------- SERVER CONFIG ---------- */
    .config-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .config-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.55rem 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .config-row input:focus { border-color: var(--accent); }

    .btn-health {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.55rem 1.1rem;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-health:hover { background: var(--border); }

    .health-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-left: 0.5rem;
      transition: background 0.3s;
    }
    .health-dot.ok   { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    .health-dot.fail { background: var(--error);   box-shadow: 0 0 6px var(--error); }

    /* ---------- FILE LIST ---------- */
    #file-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .file-entry {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      position: relative;
      transition: border-color 0.2s;
    }
    .file-entry.running  { border-color: var(--accent); }
    .file-entry.done     { border-color: var(--accent2); }
    .file-entry.errored  { border-color: var(--error); }

    .file-entry-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
    }

    .file-entry-top input.path-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      padding: 0.2rem 0.1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .file-entry-top input.path-input:focus { border-color: var(--accent); }
    .file-entry-top input.path-input::placeholder { color: var(--muted); }

    .file-num {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      min-width: 24px;
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .btn-remove:hover { color: var(--error); background: rgba(248,113,113,0.1); }

    /* schema row */
    .schema-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .schema-row input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .schema-row input:focus { border-color: var(--accent); }
    .schema-row input.col-name { flex: 1.2; }
    .schema-row input.col-type { flex: 0.8; }
    .schema-row .btn-remove-col {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.9rem; padding: 0 0.3rem;
      transition: color 0.15s;
    }
    .schema-row .btn-remove-col:hover { color: var(--error); }

    .btn-add-col {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem;
      margin-top: 0.3rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-add-col:hover { border-color: var(--accent); color: var(--accent); }

    .schema-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
    }

    /* separator / null_values row */
    .extra-params {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .extra-params label {
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .extra-params input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.25rem 0.55rem;
      width: 80px;
      outline: none;
    }
    .extra-params input:focus { border-color: var(--accent); }

    /* progress */
    .progress-wrap {
      margin-top: 0.75rem;
      display: none;
    }
    .file-entry.running .progress-wrap,
    .file-entry.done    .progress-wrap,
    .file-entry.errored .progress-wrap { display: block; }

    .progress-bar-bg {
      background: var(--border);
      border-radius: 999px;
      height: 5px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      width: 0%;
      transition: width 0.4s ease;
    }
    .file-entry.done .progress-bar-fill   { background: var(--accent2); width: 100%; }
    .file-entry.errored .progress-bar-fill { background: var(--error); }

    .status-text {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: var(--font-mono);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .file-entry.done    .status-text { color: var(--accent2); }
    .file-entry.errored .status-text { color: var(--error); }

    /* result stats */
    .result-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }
    .stat-chip {
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 0.2rem 0.6rem;
    }
    .stat-chip.green {
      background: rgba(52,211,153,0.1);
      border-color: rgba(52,211,153,0.25);
      color: var(--accent2);
    }

    /* ---------- ACTIONS ---------- */
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-add-file {
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.65rem 1.2rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-add-file:hover { border-color: var(--accent); color: var(--accent); }

    .btn-run {
      flex: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s;
      min-width: 160px;
    }
    .btn-run:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn-run:active:not(:disabled) { transform: translateY(0); }
    .btn-run:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------- LOG ---------- */
    #log {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      padding: 1rem 1.1rem;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    #log .log-line { white-space: pre-wrap; word-break: break-all; }
    #log .log-line.info  { color: var(--muted); }
    #log .log-line.ok    { color: var(--accent2); }
    #log .log-line.err   { color: var(--error); }
    #log .log-line.warn  { color: var(--warn); }
    #log .log-line.accent{ color: var(--accent); }

    /* ---------- SUMMARY ---------- */
    #summary {
      display: none;
      background: linear-gradient(135deg, rgba(167,139,250,0.08) 0%, rgba(244,114,182,0.06) 100%);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
    }
    #summary h3 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .summary-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }
    .summary-card .value {
      font-size: 1.4rem;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--text);
    }
    .summary-card .label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ---------- DOCKER HINT ---------- */
    .docker-hint {
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0.85rem 1.1rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .docker-hint code {
      font-family: var(--font-mono);
      background: var(--surface);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      color: var(--accent2);
    }
  </style>
</head>
<body>

<header>
  <div class="badge">Herramienta de conversión</div>
  <h1>CSV → Parquet</h1>
  <p>Especifica las rutas de tus archivos CSV y observa el proceso en tiempo real</p>
</header>

<div class="container">

  <!-- SERVER CONFIG -->
  <div class="panel">
    <div class="panel-title">Servidor API</div>
    <div class="config-row">
      <input type="text" id="api-base" value="http://localhost:8001" placeholder="http://localhost:8001" />
      <button class="btn-health" onclick="checkHealth()">
        Verificar conexión <span class="health-dot" id="health-dot"></span>
      </button>
    </div>
  </div>

  <!-- FILE LIST -->
  <div class="panel">
    <div class="panel-title">Archivos a convertir</div>
    <div id="file-list"></div>
    <div class="actions" style="margin-top:1rem;">
      <button class="btn-add-file" onclick="addFile()">+ Agregar archivo</button>
      <button class="btn-run" id="btn-run" onclick="runAll()">▶ Convertir todos</button>
    </div>
  </div>

  <!-- LOG -->
  <div class="panel" id="log-panel" style="padding:0;">
    <div class="panel-title" style="padding:1rem 1.5rem 0;">Registro de actividad</div>
    <div id="log"></div>
  </div>

  <!-- SUMMARY -->
  <div id="summary">
    <h3>Resumen final</h3>
    <div class="summary-grid" id="summary-grid"></div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let fileCounter = 0;
const fileStates = {}; // id → { path, schema, status, result }

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function apiBase() {
  return document.getElementById('api-base').value.replace(/\/$/, '');
}

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  const now = new Date().toLocaleTimeString('es-MX', { hour12: false });
  line.className = `log-line ${type}`;
  line.textContent = `[${now}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setEntryState(id, state) {
  const entry = document.getElementById(`entry-${id}`);
  entry.classList.remove('running', 'done', 'errored');
  if (state) entry.classList.add(state);
  fileStates[id].status = state;
}

function setStatusText(id, text) {
  document.getElementById(`status-${id}`).textContent = text;
}

function setProgress(id, pct) {
  document.getElementById(`bar-${id}`).style.width = pct + '%';
}

// ---------------------------------------------------------------------------
// Health check
// ---------------------------------------------------------------------------
async function checkHealth() {
  const dot = document.getElementById('health-dot');
  dot.className = 'health-dot';
  log('Verificando conexión con el servidor…');
  try {
    const r = await fetch(`${apiBase()}/health`, { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    dot.className = 'health-dot ok';
    log(`Servidor activo. Polars v${data.polars_version || '?'}`, 'ok');
  } catch (e) {
    dot.className = 'health-dot fail';
    log(`No se pudo conectar: ${e.message}`, 'err');
  }
}

// ---------------------------------------------------------------------------
// Add / remove file entries
// ---------------------------------------------------------------------------
function addFile() {
  fileCounter++;
  const id = fileCounter;
  fileStates[id] = { status: 'idle' };

  const entry = document.createElement('div');
  entry.className = 'file-entry';
  entry.id = `entry-${id}`;
  entry.innerHTML = `
    <div class="file-entry-top">
      <span class="file-num">#${String(id).padStart(2,'0')}</span>
      <input class="path-input" type="text" id="path-${id}"
             placeholder="D:/bases/mi_archivo.csv"
             onchange="fileStates[${id}].path = this.value" />
      <button class="btn-remove" title="Quitar archivo" onclick="removeFile(${id})">✕</button>
    </div>

    <div class="schema-label">Separador &amp; nulos</div>
    <div class="extra-params">
      <label>Sep <input type="text" id="sep-${id}" value="," style="width:50px" /></label>
      <label>Nulos <input type="text" id="nulls-${id}" value=",NULL,null,NA,N/A,na,n/a" style="width:220px" /></label>
    </div>

    <div class="schema-label" style="margin-top:0.75rem;">Schema overrides <span style="font-weight:400;font-style:italic;">(opcional)</span></div>
    <div id="schema-${id}"></div>
    <button class="btn-add-col" onclick="addSchemaRow(${id})">+ columna / tipo</button>

    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar-${id}"></div></div>
      <div class="status-text" id="status-${id}"></div>
      <div class="result-stats" id="stats-${id}"></div>
    </div>
  `;
  document.getElementById('file-list').appendChild(entry);
  document.getElementById(`path-${id}`).addEventListener('input', e => {
    fileStates[id].path = e.target.value;
  });
  log(`Archivo #${String(id).padStart(2,'0')} agregado.`);
}

function removeFile(id) {
  const entry = document.getElementById(`entry-${id}`);
  if (entry) entry.remove();
  delete fileStates[id];
  log(`Archivo #${String(id).padStart(2,'0')} removido.`, 'warn');
}

function addSchemaRow(fileId) {
  const container = document.getElementById(`schema-${fileId}`);
  const rowId = Date.now();
  const row = document.createElement('div');
  row.className = 'schema-row';
  row.id = `srow-${rowId}`;
  row.innerHTML = `
    <input class="col-name" type="text" placeholder="NOMBRE_COLUMNA" />
    <input class="col-type" type="text" placeholder="Int64 / String / Float64" />
    <button class="btn-remove-col" onclick="document.getElementById('srow-${rowId}').remove()">✕</button>
  `;
  container.appendChild(row);
}

function getSchemaOverrides(fileId) {
  const container = document.getElementById(`schema-${fileId}`);
  const rows = container.querySelectorAll('.schema-row');
  const schema = {};
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    const col = inputs[0].value.trim();
    const typ = inputs[1].value.trim();
    if (col && typ) schema[col] = typ;
  });
  return Object.keys(schema).length ? schema : null;
}

// ---------------------------------------------------------------------------
// Conversion
// ---------------------------------------------------------------------------
async function convertFile(id) {
  const path = (document.getElementById(`path-${id}`)?.value || '').trim();
  if (!path) {
    log(`#${id}: Ruta vacía, se omite.`, 'warn');
    return;
  }

  setEntryState(id, 'running');
  setStatusText(id, 'Enviando solicitud…');
  setProgress(id, 15);
  log(`#${String(id).padStart(2,'0')} → Iniciando: ${path}`, 'accent');

  const schema = getSchemaOverrides(id);
  const separator = document.getElementById(`sep-${id}`).value || ',';
  const null_values = document.getElementById(`nulls-${id}`).value || ',NULL,null,NA,N/A';

  const body = { file_path: path };
  if (schema) {
    body.schema_overrides = schema;
    body.columns = Object.keys(schema);
  }

  try {
    // Simular progreso indeterminado mientras espera
    let fakePct = 15;
    const ticker = setInterval(() => {
      if (fakePct < 85) {
        fakePct += Math.random() * 4;
        setProgress(id, Math.min(fakePct, 85));
        setStatusText(id, `Procesando… (${Math.round(fakePct)}%)`);
      }
    }, 800);

    const r = await fetch(`${apiBase()}/convert?separator=${encodeURIComponent(separator)}&null_values=${encodeURIComponent(null_values)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    clearInterval(ticker);

    if (!r.ok) {
      let detail;
      try { detail = (await r.json()).detail; } catch { detail = await r.text(); }
      throw new Error(`${r.status} ${r.statusText}: ${detail}`);
    }

    const data = await r.json();
    fileStates[id].result = data;

    setEntryState(id, 'done');
    setProgress(id, 100);
    setStatusText(id, `✓ Completado en ${data.elapsed_seconds}s — ${data.rows.toLocaleString('es-MX')} filas`);

    const statsEl = document.getElementById(`stats-${id}`);
    statsEl.innerHTML = `
      <span class="stat-chip green">${data.rows.toLocaleString('es-MX')} filas</span>
      <span class="stat-chip">${data.output_size_mb} MB</span>
      <span class="stat-chip">${data.elapsed_seconds}s</span>
      <span class="stat-chip">${data.chunks_processed} chunks</span>
      <span class="stat-chip">${data.workers_used} workers</span>
      <span class="stat-chip green" title="${data.output_file}">📄 ${data.output_file.split(/[\\/]/).pop()}</span>
    `;

    log(`#${String(id).padStart(2,'0')} ✓ ${data.rows.toLocaleString('es-MX')} filas | ${data.output_size_mb} MB | ${data.elapsed_seconds}s`, 'ok');

  } catch (e) {
    setEntryState(id, 'errored');
    setProgress(id, 100);
    setStatusText(id, `✗ Error: ${e.message}`);
    log(`#${String(id).padStart(2,'0')} ✗ ${e.message}`, 'err');
  }
}

async function runAll() {
  const btn = document.getElementById('btn-run');
  btn.disabled = true;

  const ids = Object.keys(fileStates).map(Number).filter(id => document.getElementById(`entry-${id}`));
  if (!ids.length) {
    log('No hay archivos agregados.', 'warn');
    btn.disabled = false;
    return;
  }

  log(`▶ Iniciando conversión de ${ids.length} archivo(s)…`, 'accent');
  document.getElementById('summary').style.display = 'none';

  // Procesar en paralelo
  await Promise.allSettled(ids.map(id => convertFile(id)));

  // Resumen final
  const results = ids.map(id => fileStates[id]?.result).filter(Boolean);
  if (results.length) {
    const totalRows   = results.reduce((a, r) => a + r.rows, 0);
    const totalMB     = results.reduce((a, r) => a + r.output_size_mb, 0);
    const totalSecs   = results.reduce((a, r) => a + r.elapsed_seconds, 0);

    const sumEl = document.getElementById('summary');
    document.getElementById('summary-grid').innerHTML = `
      <div class="summary-card"><div class="value">${results.length}</div><div class="label">Archivos convertidos</div></div>
      <div class="summary-card"><div class="value">${totalRows.toLocaleString('es-MX')}</div><div class="label">Filas totales</div></div>
      <div class="summary-card"><div class="value">${totalMB.toFixed(1)} MB</div><div class="label">Tamaño total</div></div>
      <div class="summary-card"><div class="value">${totalSecs.toFixed(1)}s</div><div class="label">Tiempo acumulado</div></div>
    `;
    sumEl.style.display = 'block';
  }

  log(`■ Proceso terminado. ${results.length}/${ids.length} exitosos.`, results.length === ids.length ? 'ok' : 'warn');
  btn.disabled = false;
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
addFile();
checkHealth();
</script>
</body>
